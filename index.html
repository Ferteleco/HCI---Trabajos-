<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de control de Marte</title>
  <style>
    :root {
      --fondo: #0b0f1a;
      --panel: #151c2e;
      --borde: #26324d;
      --texto: #e6ecff;
      --secundario: #9aa8c7;
      --acento: #ff6b3d;
      --ok: #34d399;
      --aviso: #fbbf24;
      --espacio: 1rem;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--fondo);
      color: var(--texto);
      line-height: 1.5;
      font-size: 1rem;
    }

    header {
      padding: var(--espacio);
      border-bottom: 1px solid var(--borde);
    }

    header h1 {
      margin: 0;
      font-size: clamp(1.25rem, 4vw, 2rem);
    }

    header p {
      margin: 0.25rem 0 0;
      color: var(--secundario);
      font-size: 0.95rem;
    }

    main {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--espacio);
      padding: var(--espacio);
      max-width: 75rem;
      margin: 0 auto;
    }

    /* Cabecera de la imagen */
    .imagen-mision {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 0.75rem;
      border: 1px solid var(--borde);
      background:
        radial-gradient(circle at 70% 30%, #ffb38a 0 6%, transparent 6.5%),
        radial-gradient(circle at 30% 80%, #5a2a1a 0 20%, transparent 21%),
        linear-gradient(160deg, #7a3320 0%, #b4502b 45%, #3a1a12 100%);
      position: relative;
      overflow: hidden;
    }

    .imagen-mision::after {
      content: "Sustituir por imagen de Marte";
      position: absolute;
      left: 0.75rem;
      bottom: 0.75rem;
      font-size: 0.8rem;
      padding: 0.25rem 0.5rem;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 0.25rem;
      color: #fff;
    }

    /* Indicadores */
    .indicadores {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--espacio);
    }

    .indicador {
      background: var(--panel);
      border: 1px solid var(--borde);
      border-radius: 0.75rem;
      padding: 1rem;
    }

    .indicador h2 {
      margin: 0 0 0.5rem;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--secundario);
    }

    .valor {
      font-size: clamp(1.75rem, 6vw, 2.5rem);
      font-weight: 700;
      margin: 0;
    }

    .barra {
      height: 0.6rem;
      background: var(--borde);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 0.75rem;
    }

    .barra span {
      display: block;
      height: 100%;
      background: var(--ok);
    }

    .estado {
      margin: 0.5rem 0 0;
      font-size: 0.9rem;
      color: var(--secundario);
    }

    .indicador.aviso .valor { color: var(--aviso); }
    .indicador.aviso .barra span { background: var(--aviso); }

    /* Tablet y escritorio: CSS Grid en dos y cuatro columnas */
    @media (min-width: 40rem) {
      .indicadores {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 60rem) {
      main {
        grid-template-columns: 1fr 1fr;
        align-items: start;
      }
      .indicadores {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Centro de control de Marte</h1>
    <p>Supervisión de la misión en tiempo real</p>
  </header>

  <main>
    <section class="imagen-mision" role="img" aria-label="Vista de la superficie de Marte"></section>

    <section class="indicadores" aria-label="Indicadores de la misión">

      <article class="indicador">
        <h2>Oxígeno</h2>
        <p class="valor">87 %</p>
        <div class="barra" aria-hidden="true"><span style="width: 87%"></span></div>
        <p class="estado">Nivel normal</p>
      </article>

      <article class="indicador">
        <h2>Energía</h2>
        <p class="valor">64 %</p>
        <div class="barra" aria-hidden="true"><span style="width: 64%"></span></div>
        <p class="estado">Carga suficiente</p>
      </article>

      <article class="indicador aviso">
        <h2>Temperatura</h2>
        <p class="valor">-63 °C</p>
        <div class="barra" aria-hidden="true"><span style="width: 40%"></span></div>
        <p class="estado">Vigilar: por debajo de la media</p>
      </article>

      <article class="indicador">
        <h2>Progreso</h2>
        <p class="valor">42 %</p>
        <div class="barra" aria-hidden="true"><span style="width: 42%"></span></div>
        <p class="estado">Misión en curso</p>
      </article>

    </section>
  </main>

</body>
</html>
