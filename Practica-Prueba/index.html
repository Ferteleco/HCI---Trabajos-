<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página de prueba de GitHub Pages</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      text-align: center;
      padding: 1rem;
      box-sizing: border-box;
    }
    h1 { font-size: clamp(1.5rem, 5vw, 2.5rem); margin: 0 0 0.5rem; }
    p { margin: 0.25rem 0 1rem; color: #475569; }
    button {
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      border: none;
      border-radius: 0.5rem;
      background: #2563eb;
      color: #ffffff;
      cursor: pointer;
    }
    #mensaje { margin-top: 1rem; font-weight: 600; }
  </style>
</head>
<body>
  <h1>¡Hola desde GitHub Pages!</h1>
  <p>Si ves esta página, la subida ha funcionado.</p>
  <button id="boton">Pulsa aquí</button>
  <p id="mensaje"></p>

  <script>
    document.getElementById('boton').addEventListener('click', function () {
      document.getElementById('mensaje').textContent = 'El botón funciona correctamente.';
    });
  </script>
</body>
</html>
