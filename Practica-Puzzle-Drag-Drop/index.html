<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle Drag &amp; Drop con temporizador</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      display: flex;
      justify-content: center;
      padding: 1rem;
    }

    :focus-visible {
      outline: 3px solid #f59e0b;
      outline-offset: 3px;
    }

    .puzzle {
      width: 100%;
      max-width: 36rem;
      background: #ffffff;
      border-radius: 1rem;
      padding: 1.25rem;
      box-shadow: 0 0.5rem 1.5rem rgba(15, 23, 42, 0.1);
      text-align: center;
    }

    /* Logo de ejemplo en forma de rombo (sustituir por el logo propio si se tiene) */
    .logo {
      display: flex;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .rombo {
      width: 5rem;
      height: 5rem;
      background: #1e3a8a;
      transform: rotate(45deg);
      border-radius: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rombo span {
      transform: rotate(-45deg);
      color: #ffffff;
      font-size: 0.6rem;
      font-weight: 800;
      text-align: center;
      line-height: 1.1;
      letter-spacing: 0.04em;
    }

    h1 {
      font-size: clamp(1.3rem, 5vw, 1.8rem);
      margin: 0 0 0.25rem;
    }

    .instrucciones {
      margin: 0 0 1rem;
      color: #475569;
      font-size: 0.95rem;
    }

    /* Temporizador */
    .temporizador {
      display: inline-block;
      font-size: 1.5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      background: #0f172a;
      color: #f8fafc;
      padding: 0.4rem 1rem;
      border-radius: 0.5rem;
      margin-bottom: 1rem;
    }

    .temporizador.completado {
      background: #15803d;
    }

    /* Piezas */
    .piezas,
    .huecos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .pieza {
      min-height: 5.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      color: #ffffff;
      background: #6366f1;
      border-radius: 0.75rem;
      cursor: grab;
      user-select: none;
      touch-action: none;
      transition: transform 0.15s ease;
    }

    .pieza:active { cursor: grabbing; }

    .pieza.seleccionada {
      transform: scale(1.06);
      box-shadow: 0 0 0 4px #f59e0b;
    }

    .pieza.colocada {
      cursor: default;
      background: #15803d;
    }

    /* Huecos */
    .hueco {
      min-height: 5.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      color: #94a3b8;
      border: 2px dashed #94a3b8;
      border-radius: 0.75rem;
      background: #f8fafc;
    }

    .hueco.sobre {
      background: #e0e7ff;
      border-color: #6366f1;
    }

    .hueco.correcto {
      background: #dcfce7;
      border: 2px solid #15803d;
      color: #15803d;
    }

    .hueco.incorrecto {
      border-color: #b91c1c;
    }

    .resultado {
      min-height: 1.5em;
      font-weight: 600;
      margin: 0.5rem 0 1rem;
    }

    .resultado.error { color: #b91c1c; }
    .resultado.ok { color: #15803d; }

    .boton {
      min-height: 2.75rem;
      padding: 0.5rem 1.25rem;
      font: inherit;
      font-weight: 600;
      color: #ffffff;
      background: #2563eb;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
    }

    .boton:hover { background: #1d4ed8; }

    @media (min-width: 40rem) {
      .pieza, .hueco { min-height: 7rem; font-size: 2.5rem; }
    }
  </style>
</head>
<body>

  <main class="puzzle">
    <div class="logo" aria-hidden="true">
      <div class="rombo"><span>MI<br>EMPRESA</span></div>
    </div>
    <h1>Puzzle Drag &amp; Drop 🧩</h1>
    <p class="instrucciones">
      Arrastra cada pieza a su hueco correcto. En móvil o con teclado, pulsa una pieza y después el hueco.
    </p>

    <p class="temporizador" id="temporizador" aria-live="off">00:00.0</p>

    <!-- Piezas que el usuario arrastra -->
    <div class="piezas" id="piezas" aria-label="Piezas">
      <div class="pieza" draggable="true" id="pieza-1" data-valor="1" tabindex="0" role="button" aria-label="Pieza 1">1</div>
      <div class="pieza" draggable="true" id="pieza-2" data-valor="2" tabindex="0" role="button" aria-label="Pieza 2">2</div>
      <div class="pieza" draggable="true" id="pieza-3" data-valor="3" tabindex="0" role="button" aria-label="Pieza 3">3</div>
    </div>

    <!-- Huecos donde se sueltan las piezas -->
    <div class="huecos" id="huecos" aria-label="Huecos">
      <div class="hueco" data-correcto="1" tabindex="0" aria-label="Hueco 1">1</div>
      <div class="hueco" data-correcto="2" tabindex="0" aria-label="Hueco 2">2</div>
      <div class="hueco" data-correcto="3" tabindex="0" aria-label="Hueco 3">3</div>
    </div>

    <p class="resultado" id="resultado" aria-live="polite"></p>

    <button type="button" class="boton" id="reiniciar">Reiniciar</button>
  </main>

  <script>
    const piezas = document.querySelectorAll('.pieza');
    const huecos = document.querySelectorAll('.hueco');
    const temporizadorEl = document.getElementById('temporizador');
    const resultado = document.getElementById('resultado');
    const botonReiniciar = document.getElementById('reiniciar');

    let piezaSeleccionada = null;
    let colocadas = 0;
    let inicio = null;          // momento en que empieza el cronómetro
    let intervalo = null;       // referencia del setInterval
    let tiempoFinal = null;

    // ---------- TEMPORIZADOR ----------
    function formatear(ms) {
      const decimas = Math.floor((ms % 1000) / 100);
      const segundos = Math.floor(ms / 1000) % 60;
      const minutos = Math.floor(ms / 60000);
      return `${String(minutos).padStart(2, '0')}:${String(segundos).padStart(2, '0')}.${decimas}`;
    }

    function arrancarCronometro() {
      if (inicio !== null) return; // solo arranca una vez
      inicio = Date.now();
      intervalo = setInterval(() => {
        temporizadorEl.textContent = formatear(Date.now() - inicio);
      }, 100);
    }

    function pararCronometro() {
      clearInterval(intervalo);
      tiempoFinal = Date.now() - inicio;
      temporizadorEl.textContent = formatear(tiempoFinal);
      temporizadorEl.classList.add('completado');
    }

    // ---------- LÓGICA DE COLOCAR PIEZA ----------
    function colocar(pieza, hueco) {
      const valorPieza = pieza.dataset.valor;
      const valorHueco = hueco.dataset.correcto;

      arrancarCronometro();

      if (valorPieza === valorHueco) {
        hueco.textContent = pieza.textContent;
        hueco.classList.remove('sobre', 'incorrecto');
        hueco.classList.add('correcto');
        hueco.dataset.ocupado = 'true';
        pieza.classList.add('colocada');
        pieza.draggable = false;
        pieza.setAttribute('aria-disabled', 'true');
        colocadas++;
        resultado.className = 'resultado ok';
        resultado.textContent = '¡Correcto!';

        if (colocadas === piezas.length) {
          pararCronometro();
          resultado.className = 'resultado ok';
          resultado.textContent = `¡Puzzle completado en ${formatear(tiempoFinal)}!`;
        }
      } else {
        hueco.classList.add('incorrecto');
        resultado.className = 'resultado error';
        resultado.textContent = 'Esa pieza no va en ese hueco. Inténtalo de nuevo.';
      }

      quitarSeleccion();
    }

    function quitarSeleccion() {
      if (piezaSeleccionada) piezaSeleccionada.classList.remove('seleccionada');
      piezaSeleccionada = null;
    }

    // ---------- DRAG & DROP (ratón) ----------
    piezas.forEach(pieza => {
      pieza.addEventListener('dragstart', event => {
        event.dataTransfer.setData('text/plain', pieza.id);
        event.dataTransfer.effectAllowed = 'move';
        pieza.classList.add('seleccionada');
        piezaSeleccionada = pieza;
      });

      pieza.addEventListener('dragend', () => {
        quitarSeleccion();
      });

      // ---------- SELECCIÓN CON TECLADO Y TÁCTIL ----------
      pieza.addEventListener('click', () => {
        if (pieza.classList.contains('colocada')) return;
        quitarSeleccion();
        piezaSeleccionada = pieza;
        pieza.classList.add('seleccionada');
        resultado.className = 'resultado';
        resultado.textContent = 'Pieza seleccionada. Ahora pulsa su hueco.';
      });

      pieza.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          pieza.click();
        }
      });
    });

    huecos.forEach(hueco => {
      hueco.addEventListener('dragover', event => {
        event.preventDefault(); // necesario para permitir soltar
        hueco.classList.add('sobre');
      });

      hueco.addEventListener('dragleave', () => {
        hueco.classList.remove('sobre');
      });

      hueco.addEventListener('drop', event => {
        event.preventDefault();
        hueco.classList.remove('sobre');
        const id = event.dataTransfer.getData('text/plain');
        const pieza = document.getElementById(id);
        if (pieza && !hueco.dataset.ocupado) colocar(pieza, hueco);
      });

      // ---------- SELECCIÓN CON TECLADO Y TÁCTIL ----------
      hueco.addEventListener('click', () => {
        if (!piezaSeleccionada || hueco.dataset.ocupado) return;
        colocar(piezaSeleccionada, hueco);
      });

      hueco.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          hueco.click();
        }
      });
    });

    // ---------- REINICIAR ----------
    botonReiniciar.addEventListener('click', () => {
      clearInterval(intervalo);
      inicio = null;
      colocadas = 0;
      tiempoFinal = null;
      temporizadorEl.textContent = '00:00.0';
      temporizadorEl.classList.remove('completado');
      resultado.className = 'resultado';
      resultado.textContent = '';

      piezas.forEach(p => {
        p.classList.remove('colocada', 'seleccionada');
        p.draggable = true;
        p.removeAttribute('aria-disabled');
      });

      huecos.forEach(h => {
        h.textContent = h.dataset.correcto;
        h.classList.remove('correcto', 'incorrecto', 'sobre');
        delete h.dataset.ocupado;
      });

      piezaSeleccionada = null;
    });
  </script>

</body>
</html>
